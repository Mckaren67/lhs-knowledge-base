<head>

<title>LHS Knowledge Base</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2d6a4f;--green-d:#1b4332;--green-l:#e8f5ee;--green-m:#95d5b2;
  --amber:#b5631a;--amber-l:#fef3e8;
  --blue:#1a5c8a;--blue-l:#e8f3fb;
  --red:#c0392b;--red-l:#fdecea;
  --gray:#5c5c5c;--gray-l:#f5f5f3;--gray-b:#e0e0dc;
  --text:#1a1a18;--text-m:#6b6b68;--text-l:#9b9b98;
  --white:#fff;--radius:10px;--radius-s:6px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
body{font-family:'DM Sans',sans-serif;background:#eeede9;color:var(--text);min-height:100vh;font-size:14px}

/* Header */
.hdr{background:var(--green-d);color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-icon{width:30px;height:30px;background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.hdr-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.hdr-sub{font-size:11px;opacity:.65;margin-top:1px}
.hdr-stats{display:flex;gap:8px;align-items:center}
.hdr-pill{font-size:11px;background:rgba(255,255,255,.12);padding:3px 10px;border-radius:99px;white-space:nowrap}

/* Layout */
.app{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 52px)}

/* Sidebar */
.sidebar{background:var(--white);border-right:1px solid var(--gray-b);display:flex;flex-direction:column;overflow:hidden}
.s-tabs{display:flex;border-bottom:1px solid var(--gray-b)}
.s-tab{flex:1;padding:11px 8px;font-size:13px;font-weight:500;text-align:center;cursor:pointer;color:var(--text-m);border:none;border-bottom:2px solid transparent;background:none;font-family:inherit;transition:all .15s}
.s-tab.active{color:var(--green);border-bottom-color:var(--green)}
.s-search{padding:10px 12px;border-bottom:1px solid var(--gray-b)}
.s-search input{width:100%;padding:7px 10px;font-size:13px;font-family:inherit;border:1px solid var(--gray-b);border-radius:var(--radius-s);background:var(--gray-l);color:var(--text);outline:none}
.s-search input:focus{border-color:var(--green-m);background:#fff}
.s-filters{padding:8px 12px;border-bottom:1px solid var(--gray-b);display:flex;gap:5px;flex-wrap:wrap}
.f-btn{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--gray-b);background:#fff;cursor:pointer;color:var(--text-m);font-family:inherit;transition:all .12s}
.f-btn.active{background:var(--green-l);border-color:var(--green-m);color:var(--green);font-weight:500}
.s-list{overflow-y:auto;flex:1}
.s-progress{padding:8px 12px;border-bottom:1px solid var(--gray-b);font-size:11px;color:var(--text-m)}
.s-prog-bar{height:4px;background:var(--gray-b);border-radius:99px;margin-top:5px;overflow:hidden}
.s-prog-fill{height:4px;background:var(--green);border-radius:99px;transition:width .4s}

/* List items */
.li{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--gray-b);transition:background .1s;display:flex;align-items:center;gap:9px}
.li:hover{background:var(--gray-l)}
.li.active{background:var(--green-l);border-left:3px solid var(--green)}
.li-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.av-res{background:#dbeafe;color:#1e40af}
.av-com{background:#fce7f3;color:#9d174d}
.av-cl{background:var(--green-l);color:var(--green)}
.li-info{flex:1;min-width:0}
.li-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:11px;color:var(--text-m);margin-top:1px}
.li-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.li-note-dot{width:7px;height:7px;border-radius:50%;background:#f59e0b;flex-shrink:0}

/* Main */
.main{overflow-y:auto;background:#eeede9;padding:20px}
.main-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-m);font-size:14px}

/* Form card */
.card{max-width:740px;margin:0 auto 20px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
.card-hdr{padding:18px 22px;border-bottom:1px solid var(--gray-b);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-hdr-l{display:flex;align-items:center;gap:13px}
.card-av{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;flex-shrink:0}
.card-name{font-size:16px;font-weight:600;letter-spacing:-.02em}
.card-meta{font-size:11px;color:var(--text-m);margin-top:3px;line-height:1.5}
.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:500;padding:2px 8px;border-radius:99px}
.b-weekly{background:var(--green-l);color:var(--green)}
.b-biweekly{background:var(--blue-l);color:var(--blue)}
.b-monthly{background:var(--amber-l);color:var(--amber)}
.b-occasional{background:var(--gray-l);color:var(--gray)}
.b-high{background:#fee2e2;color:#991b1b}
.b-medium{background:#fef3c7;color:#92400e}
.b-standard{background:var(--gray-l);color:var(--gray)}
.b-commercial{background:#fdf4ff;color:#7e22ce}
.b-residential{background:var(--green-l);color:var(--green)}
.b-notes{background:#fef3c7;color:#92400e}

/* Sections */
.card-body{padding:18px 22px}
.sec{margin-bottom:18px}
.sec-title{font-size:11px;font-weight:600;color:var(--text-m);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--gray-b);display:flex;align-items:center;gap:8px}
.auto-tag{font-size:9px;background:var(--blue-l);color:var(--blue);padding:2px 6px;border-radius:99px;text-transform:none;letter-spacing:0;font-weight:500}
.hcp-tag{font-size:9px;background:var(--green-l);color:var(--green);padding:2px 6px;border-radius:99px;text-transform:none;letter-spacing:0;font-weight:500}

/* Grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid.full{grid-template-columns:1fr}
.grid.three{grid-template-columns:1fr 1fr 1fr}
.fg{display:flex;flex-direction:column;gap:4px}
.fl{font-size:11px;font-weight:500;color:var(--text-m)}
.fi{font-size:13px;padding:7px 10px;border-radius:var(--radius-s);border:1px solid var(--gray-b);background:var(--gray-l);color:var(--text);font-family:inherit;outline:none;width:100%;transition:all .15s}
.fi:focus{border-color:var(--green-m);background:#fff;box-shadow:0 0 0 3px rgba(45,106,79,.07)}
select.fi{cursor:pointer}
textarea.fi{resize:vertical;min-height:90px;line-height:1.5}
.fi.prefilled{background:#f0faf5;border-color:var(--green-m)}
.cb-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:3px}
.cb-item{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer}
.cb-item input{accent-color:var(--green)}

/* HCP Notes box */
.notes-box{background:#fffbeb;border:1px solid #fcd34d;border-radius:var(--radius-s);padding:12px 14px;font-size:12px;color:#78350f;line-height:1.6;white-space:pre-wrap;max-height:200px;overflow-y:auto;font-family:'DM Mono',monospace}
.notes-date{font-size:10px;color:var(--text-l);margin-bottom:6px}
.alert-box{background:var(--red-l);border:1px solid #fca5a5;border-radius:var(--radius-s);padding:10px 13px;font-size:12px;color:var(--red);margin-bottom:12px;line-height:1.5}

/* Footer */
.card-ftr{padding:14px 22px;border-top:1px solid var(--gray-b);display:flex;align-items:center;gap:10px;background:var(--gray-l);border-radius:0 0 var(--radius) var(--radius)}
.btn-save{padding:8px 18px;border-radius:var(--radius-s);border:none;background:var(--green);color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-save:hover{background:var(--green-d)}
.btn-save:active{transform:scale(.98)}
.btn-clear{padding:8px 14px;border-radius:var(--radius-s);border:1px solid var(--gray-b);background:#fff;color:var(--text-m);font-size:13px;cursor:pointer;font-family:inherit}
.save-ok{font-size:12px;color:var(--green);display:none}

@media(max-width:640px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .grid{grid-template-columns:1fr}
  .grid.three{grid-template-columns:1fr 1fr}
}
</style>
</head>

let mode='clients', selIdx=0, activeFilter='all';
let saved=JSON.parse(localStorage.getItem('lhs_kb2')||'{}');

function ini(n){return (n||'').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase()}
function norm(s){return (s||'').toLowerCase().trim()}
function fBadge(f){const m={'Weekly':'weekly','Bi-weekly':'biweekly','Monthly':'monthly','Occasional':'occasional'};return`<span class="badge b-${m[f]||'occasional'}">${f}</span>`}

function persist(){localStorage.setItem('lhs_kb2',JSON.stringify(saved))}

function updateProgress(){
  const items=mode==='clients'?CLIENTS:CLEANERS;
  const total=items.length;
  const done=Object.keys(saved).filter(k=>k.startsWith(mode+'_') && saved[k]._complete).length;
  const savedCount=Object.keys(saved).filter(k=>k.startsWith(mode+'_')).length;
  document.getElementById('prog-label').textContent=`${savedCount} of ${total} profiles saved`;
  document.getElementById('prog-fill').style.width=`${Math.round(savedCount/total*100)}%`;
  document.getElementById('hdr-saved').textContent=`${Object.keys(saved).length} saved`;
  document.getElementById('hdr-total').textContent=`${CLIENTS.length} clients · ${CLEANERS.length} cleaners`;
}

function switchMode(m,el){
  mode=m;selIdx=0;activeFilter='all';
  document.getElementById('search').value='';
  document.querySelectorAll('.s-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderFilters();renderList();renderForm(0);updateProgress();
}

function renderFilters(){
  const fb=document.getElementById('filter-bar');
  fb.innerHTML=mode==='clients'
    ?`<button class="f-btn active" onclick="setFilter('all',this)">All</button>
      <button class="f-btn" onclick="setFilter('Weekly',this)">Weekly</button>
      <button class="f-btn" onclick="setFilter('Bi-weekly',this)">Bi-weekly</button>
      <button class="f-btn" onclick="setFilter('Monthly',this)">Monthly</button>
      <button class="f-btn" onclick="setFilter('High',this)">High priority</button>
      <button class="f-btn" onclick="setFilter('notes',this)">Has notes</button>`
    :`<button class="f-btn active" onclick="setFilter('all',this)">All</button>
      <button class="f-btn" onclick="setFilter('active',this)">Active</button>
      <button class="f-btn" onclick="setFilter('saved',this)">Saved</button>`;
}

function setFilter(f,el){
  activeFilter=f;
  document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  selIdx=0;renderList();renderForm(0);
}

function getFiltered(){
  const q=norm(document.getElementById('search').value);
  const items=mode==='clients'?CLIENTS:CLEANERS;
  return items.filter(i=>{
    if(q && !norm(i.name).includes(q)) return false;
    if(activeFilter==='all') return true;
    if(mode==='clients'){
      if(activeFilter==='notes') return i.has_notes;
      if(activeFilter==='High') return i.priority==='High';
      return i.frequency===activeFilter;
    } else {
      if(activeFilter==='active') return i.jobs>0;
      if(activeFilter==='saved') return !!saved['cleaners_'+i.name];
      return true;
    }
  });
}

function filterList(){selIdx=0;renderList();renderForm(0)}

function renderList(){
  const filtered=getFiltered();
  updateProgress();
  document.getElementById('list-panel').innerHTML=filtered.length
    ? filtered.map((item,i)=>{
        const key=mode+'_'+item.name;
        const isSaved=!!saved[key];
        const isActive=i===selIdx;
        const avCls=mode==='cleaners'?'av-cl':(item.client_type==='Commercial'?'av-com':'av-res');
        const sub=mode==='clients'?`${item.frequency} · ${item.job_count} jobs · Last: ${item.last_job}`:`${item.jobs} jobs`;
        const dot=isSaved?'<div class="li-dot"></div>':(mode==='clients'&&item.has_notes?'<div class="li-note-dot"></div>':'');
        return`<div class="li ${isActive?'active':''}" onclick="selectItem(${i})">
          <div class="li-av ${avCls}">${ini(item.name)}</div>
          <div class="li-info">
            <div class="li-name">${item.name}</div>
            <div class="li-sub">${sub}</div>
          </div>${dot}
        </div>`;
      }).join('')
    :'<div style="padding:16px;font-size:13px;color:#999">No results</div>';
}

function selectItem(i){selIdx=i;renderList();renderForm(i)}

function renderForm(i){
  const filtered=getFiltered();
  if(!filtered[i]){document.getElementById('main-panel').innerHTML='<div class="main-empty">Select a client or cleaner to view their profile</div>';return}
  const item=filtered[i];
  if(mode==='clients') renderClientForm(item);
  else renderCleanerForm(item);
}

        <span class="badge b-${(c.client_type||'').toLowerCase()}">${c.client_type}</span>
        <span class="badge b-${(c.priority||'standard').toLowerCase()}">${c.priority} priority</span>
        ${c.has_notes?'<span class="badge b-notes">HCP notes</span>':''}
      </div>
    </div>
    <div class="card-body">
      ${hasAlert?`<div class="alert-box">⚠️ Important info in HCP notes — check work order below before assigning a cleaner.</div>`:''}

      ${c.hcp_notes?`
      <div class="sec">
        <div class="sec-title">HCP job notes <span class="hcp-tag">live from HCP · overrides all other data</span></div>
        <div class="notes-date">Last updated: ${c.notes_date}</div>
        <div class="notes-box">${notesPreview}</div>
      </div>`:''}

      <div class="sec">
        <div class="sec-title">Contact <span class="auto-tag">auto-filled</span></div>
        <div class="grid">
          <div class="fg"><label class="fl">Email</label><input class="fi ${c.email?'prefilled':''}" id="f-email" value="${s.email||c.email||''}" placeholder="Email"/></div>
          <div class="fg"><label class="fl">Phone</label><input class="fi ${c.phone?'prefilled':''}" id="f-phone" value="${s.phone||c.phone||''}" placeholder="Phone"/></div>
        </div>
        <div class="grid" style="margin-top:10px">
          <div class="fg"><label class="fl">City</label><input class="fi prefilled" id="f-city" value="${s.city||c.city||''}"/></div>
          <div class="fg"><label class="fl">Client type</label>
            <select class="fi" id="f-type">
              <option ${(s.client_type||c.client_type)==='Commercial'?'selected':''}>Commercial</option>
              <option ${(s.client_type||c.client_type)==='Residential'?'selected':''}>Residential</option>
            </select>
          </div>
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">Scheduling <span class="auto-tag">auto-filled from history</span></div>
        <div class="grid three">
          <div class="fg"><label class="fl">Frequency</label>
            <select class="fi" id="f-freq">
              ${['Weekly','Bi-weekly','Monthly','Occasional'].map(f=>`<option ${(s.frequency||c.frequency)===f?'selected':''}>${f}</option>`).join('')}
            </select>
          </div>
          <div class="fg"><label class="fl">Preferred day</label>
            <select class="fi" id="f-day">
              ${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','Flexible'].map(d=>`<option ${(s.preferred_day||c.preferred_day)===d?'selected':''}>${d}</option>`).join('')}
            </select>
          </div>
          <div class="fg"><label class="fl">Preferred time</label>
            <select class="fi" id="f-time">
              ${['Morning (8am–12pm)','Afternoon (12pm–4pm)','Flexible'].map(t=>`<option ${(s.preferred_time||'Flexible')===t?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="grid" style="margin-top:10px">
          <div class="fg"><label class="fl">Preferred cleaner <span class="auto-tag">auto-filled</span></label>
            <input class="fi prefilled" id="f-cleaner" value="${s.preferred_cleaner||c.preferred_cleaner||''}"/></div>
          <div class="fg"><label class="fl">Backup cleaner</label>
            <input class="fi" id="f-backup" value="${s.backup_cleaner||''}" placeholder="If preferred unavailable"/></div>
        </div>
        <div class="grid" style="margin-top:10px">
          <div class="fg"><label class="fl">Priority</label>
            <select class="fi" id="f-priority">
              ${['High — never miss','Medium — reschedule same week','Standard'].map(p=>`<option ${(s.priority_label||'')===p?'selected':''}>${p}</option>`).join('')}
            </select>
          </div>
          <div class="fg"><label class="fl">Avg job duration (hrs)</label>
            <input class="fi" id="f-duration" type="number" step="0.5" value="${s.duration||''}" placeholder="e.g. 2.5"/></div>
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">Entry & access</div>
        <div class="grid full">
          <div class="fg"><label class="fl">Entry instructions / lockbox / code</label>
            <textarea class="fi" id="f-entry" placeholder="e.g. Garage keypad code 1234. Enter through garage. Alarm code 9200.">${s.entry||''}</textarea></div>
        </div>
        <div class="grid" style="margin-top:10px">
          <div class="fg"><label class="fl">Parking instructions</label>
            <input class="fi" id="f-parking" value="${s.parking||''}" placeholder="e.g. Yes, use driveway"/></div>
          <div class="fg"><label class="fl">Notification preference</label>
            <select class="fi" id="f-notify">
              ${['SMS only','Email only','Both SMS and email','Call only','No notifications'].map(n=>`<option ${(s.notify||'SMS only')===n?'selected':''}>${n}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">Pets & health</div>
        <div class="grid">
          <div class="fg"><label class="fl">Pets (type, count, names)</label>
            <input class="fi" id="f-pets" value="${s.pets||''}" placeholder="e.g. 2 dogs — Oliver & Frankie, 2 cats — Gail & Babs"/></div>
          <div class="fg"><label class="fl">Health / accessibility notes</label>
            <input class="fi" id="f-health" value="${s.health||''}" placeholder="e.g. Client uses oxygen. Spouse has mobility issues."/></div>
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">Special requests & work order</div>
        <div class="grid full">
          <div class="fg"><label class="fl">Special requests / things to always do or never do</label>
            <textarea class="fi" id="f-special" placeholder="e.g. Always make beds. Use Murphy Oil on floors. DO NOT clean wife's TV room.">${s.special||''}</textarea></div>
        </div>
        <div class="grid full" style="margin-top:10px">
          <div class="fg"><label class="fl">Additional notes for the scheduling assistant</label>
            <textarea class="fi" id="f-notes" placeholder="Anything else the assistant should know...">${s.notes||''}</textarea></div>
        </div>
        <div class="grid" style="margin-top:10px">
          <div class="fg"><label class="fl">Payment method</label>
            <select class="fi" id="f-payment">
              ${['e-Transfer','Credit card','Cash','Invoice','Other'].map(p=>`<option ${(s.payment||'e-Transfer')===p?'selected':''}>${p}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="card-ftr">
      <button class="btn-save" onclick="saveClient('${key}')">Save profile</button>
      <button class="btn-clear" onclick="clearSaved('${key}')">Clear</button>
      <span class="save-ok" id="ok-${key}">✓ Saved!</span>
    </div>
  </div>`;
}

function renderCleanerForm(c){
  const key='cleaners_'+c.name;
  const s=saved[key]||{};
  const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const workDays=s.days||c.days||[];

  document.getElementById('main-panel').innerHTML=`
  <div class="card">
    <div class="card-hdr">
      <div class="card-hdr-l">
        <div class="card-av av-cl">${ini(c.name)}</div>
        <div>
          <div class="card-name">${c.name}</div>
          <div class="card-meta">${c.jobs} jobs in last 12 months · ${c.jobs>100?'Senior':'Regular'} team member</div>
        </div>
      </div>
      <span class="badge b-${c.jobs>100?'weekly':c.jobs>50?'biweekly':'monthly'}">${c.jobs>100?'Top performer':c.jobs>50?'Active':'New/Part-time'}</span>
    </div>
    <div class="card-body">
      <div class="sec">
        <div class="sec-title">Availability <span class="auto-tag">auto-filled from HCP</span></div>
        <div class="fg" style="margin-bottom:10px">
          <label class="fl">Working days</label>
          <div class="cb-group">
            ${days.map(d=>`<label class="cb-item"><input type="checkbox" name="day-${key}" value="${d}" ${workDays.includes(d)?'checked':''}> ${d.slice(0,3)}</label>`).join('')}
          </div>
        </div>
        <div class="grid">
          <div class="fg"><label class="fl">Start time</label><input class="fi" id="f-start" type="time" value="${s.start||'08:00'}"/></div>
          <div class="fg"><label class="fl">End time</label><input class="fi" id="f-end" type="time" value="${s.end||'17:00'}"/></div>
        </div>
        <div class="grid" style="margin-top:10px">
          <div class="fg"><label class="fl">Max jobs per day</label><input class="fi" id="f-maxjobs" type="number" value="${s.maxjobs||3}" min="1" max="10"/></div>
          <div class="fg"><label class="fl">Travel zone</label>
            <select class="fi" id="f-zone">
              ${['Chilliwack only','Chilliwack + Agassiz','Chilliwack + Rosedale','All areas'].map(z=>`<option ${(s.zone||'All areas')===z?'selected':''}>${z}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
      <div class="sec">
        <div class="sec-title">Skills</div>
        <div class="fg">
          <label class="fl">Specializations</label>
          <div class="cb-group">
            ${['Deep clean','Commercial','Residential','Move-in/out','Post-construction','Elderly clients','Large homes','Fragrance-free'].map(sk=>`<label class="cb-item"><input type="checkbox" name="skill-${key}" value="${sk}" ${(s.skills||[]).includes(sk)?'checked':''}> ${sk}</label>`).join('')}
          </div>
        </div>
      </div>
      <div class="sec">
        <div class="sec-title">Notes & preferences</div>
        <div class="grid full">
          <div class="fg"><label class="fl">Key clients they work best with</label>
            <textarea class="fi" id="f-best" placeholder="e.g. Regular at Valley Toyota, excellent with elderly clients...">${s.best||''}</textarea></div>
        </div>
        <div class="grid full" style="margin-top:10px">
          <div class="fg"><label class="fl">Clients to avoid / restrictions</label>
            <textarea class="fi" id="f-avoid" placeholder="e.g. Avoid Agassiz clients (too far). Not comfortable with large dogs.">${s.avoid||''}</textarea></div>
        </div>
        <div class="grid" style="margin-top:10px">
          <div class="fg"><label class="fl">Employment status</label>
            <select class="fi" id="f-status">
              ${['Active — full time','Active — part time','On leave','Inactive'].map(st=>`<option ${(s.status||'Active — full time')===st?'selected':''}>${st}</option>`).join('')}
            </select>
          </div>
          <div class="fg"><label class="fl">Preferred notification</label>
            <select class="fi" id="f-cnotify">
              ${['SMS','Email','Both','Phone call'].map(n=>`<option ${(s.cnotify||'SMS')===n?'selected':''}>${n}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="grid full" style="margin-top:10px">
          <div class="fg"><label class="fl">Additional notes</label>
            <textarea class="fi" id="f-cnotes" placeholder="e.g. Has own vehicle, very reliable, available for emergency cover...">${s.cnotes||''}</textarea></div>
        </div>
      </div>
    </div>
    <div class="card-ftr">
      <button class="btn-save" onclick="saveCleaner('${key}')">Save profile</button>
      <button class="btn-clear" onclick="clearSaved('${key}')">Clear</button>
      <span class="save-ok" id="ok-${key}">✓ Saved!</span>
    </div>
  </div>`;
}

function saveClient(key){
  saved[key]={
    email:val('f-email'),phone:val('f-phone'),city:val('f-city'),
    client_type:val('f-type'),frequency:val('f-freq'),preferred_day:val('f-day'),
    preferred_time:val('f-time'),preferred_cleaner:val('f-cleaner'),
    backup_cleaner:val('f-backup'),duration:val('f-duration'),
    priority_label:val('f-priority'),entry:val('f-entry'),parking:val('f-parking'),
    notify:val('f-notify'),pets:val('f-pets'),health:val('f-health'),
    special:val('f-special'),notes:val('f-notes'),payment:val('f-payment'),
    _complete:true,_saved_at:new Date().toISOString()
  };
  persist();showOk(key);renderList();
}

function saveCleaner(key){
  const days=[...document.querySelectorAll(`input[name="day-${key}"]:checked`)].map(e=>e.value);
  const skills=[...document.querySelectorAll(`input[name="skill-${key}"]:checked`)].map(e=>e.value);
  saved[key]={
    days,skills,start:val('f-start'),end:val('f-end'),
    maxjobs:val('f-maxjobs'),zone:val('f-zone'),
    best:val('f-best'),avoid:val('f-avoid'),
    status:val('f-status'),cnotify:val('f-cnotify'),cnotes:val('f-cnotes'),
    _complete:true,_saved_at:new Date().toISOString()
  };
  persist();showOk(key);renderList();
}

function clearSaved(key){
  if(!confirm('Clear saved data for this profile?')) return;
  delete saved[key];persist();renderList();renderForm(selIdx);
}

function val(id){return document.getElementById(id)?.value||''}
function showOk(key){
  const el=document.getElementById('ok-'+key);
  if(el){el.style.display='inline';setTimeout(()=>el.style.display='none',2500)}
}

// Init
renderFilters();renderList();renderForm(0);updateProgress();
</script>
</body>
</html>
