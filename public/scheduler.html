<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LHS Scheduler — Karen's Working Page</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2129;
  --panel-2: #232c36;
  --border: #2f3a47;
  --text: #e8eef5;
  --text-dim: #94a3b8;
  --accent: #d4a574;
  --accent-2: #7ba7c9;
  --trainee: #84cc16;
  --critical: #dc2626;
  --warning: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Inter', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; }
#root { padding: 18px; max-width: 1700px; margin: 0 auto; }

/* Header */
.app-header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.app-title { font-family: Georgia, serif; font-size: 24px; }
.app-title .accent { color: var(--accent); }
.app-subtitle { color: var(--text-dim); font-size: 12px; margin-top: 3px; }

/* Buttons */
.btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 7px 14px; border-radius: 5px; cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.12s; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: #2d3845; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { background: transparent; color: var(--critical); border-color: var(--critical); }
.btn.danger:hover { background: rgba(220, 38, 38, 0.15); }
.btn.success { background: var(--trainee); color: #0a0e13; border-color: var(--trainee); font-weight: 600; }
.btn.active { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
.btn.tiny { padding: 4px 8px; font-size: 11px; }

/* Toolbar */
.toolbar { background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 12px 14px; margin-bottom: 12px; }
.toolbar-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.toolbar-row + .toolbar-row { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.toolbar-label { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 6px; }
.spacer { color: var(--text-dim); margin: 0 2px; }

/* Status bar */
.status-bar { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; margin-bottom: 12px; font-size: 12px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.status-bar .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; background: var(--panel-2); font-size: 11px; }
.status-bar .pill.live { background: rgba(132, 204, 22, 0.15); color: var(--trainee); border: 1px solid rgba(132, 204, 22, 0.3); }
.status-bar .pill.stale { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }

/* Banner */
.banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; line-height: 1.5; }
.banner.info { background: rgba(123, 167, 201, 0.1); border: 1px solid rgba(123, 167, 201, 0.3); color: var(--text); }
.banner.warning { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.4); color: var(--text); }
.banner.success { background: rgba(132, 204, 22, 0.1); border: 1px solid rgba(132, 204, 22, 0.3); color: var(--text); }
.banner strong { color: var(--accent); }

/* Conflict badges */
.conflict-list { background: rgba(220, 38, 38, 0.05); border: 1px solid rgba(220, 38, 38, 0.3); border-radius: 6px; padding: 10px 14px; margin-bottom: 12px; }
.conflict-list-title { color: var(--critical); font-weight: 600; font-size: 13px; margin-bottom: 6px; }
.conflict-item { font-size: 12px; padding: 4px 0; border-top: 1px dashed rgba(220, 38, 38, 0.2); }
.conflict-item:first-of-type { border-top: none; }

/* Calendar */
.calendar { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; display: grid; grid-template-columns: 50px repeat(7, 1fr); overflow: hidden; }
.cal-header { background: var(--panel-2); padding: 8px 6px; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-dim); border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.05em; }
.cal-header:last-child { border-right: none; }
.cal-header .date-num { display: block; font-family: Georgia, serif; font-size: 17px; color: var(--text); margin-top: 2px; text-transform: none; font-weight: 400; }
.cal-header.weekend .date-num { color: var(--text-dim); }
.time-col { background: var(--panel-2); border-right: 1px solid var(--border); position: relative; }
.time-label { position: absolute; right: 4px; font-size: 9px; color: var(--text-dim); transform: translateY(-5px); }
.day-col { border-right: 1px solid var(--border); position: relative; min-height: 800px; }
.day-col:last-child { border-right: none; }
.day-col.weekend { background: rgba(0, 0, 0, 0.15); }
.hour-line { position: absolute; left: 0; right: 0; height: 0.5px; background: var(--border); opacity: 0.6; }
.half-line { position: absolute; left: 0; right: 0; height: 0.5px; background: var(--border); opacity: 0.18; }

/* Job blocks */
.job { position: absolute; background: var(--c, #5a6b7d); border-radius: 4px; padding: 4px 6px; font-size: 10px; line-height: 1.25; color: #fff; overflow: hidden; cursor: pointer; transition: all 0.12s; border-left: 3px solid rgba(255, 255, 255, 0.4); z-index: 3; text-shadow: 0 0.5px 0.5px rgba(0, 0, 0, 0.4); }
.job:hover { z-index: 20; transform: scale(1.02); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5); filter: brightness(1.15); }
.job.trainee { box-shadow: inset 0 0 0 2px var(--trainee); }
.job.conflict { animation: pulse-red 2s infinite; }
@keyframes pulse-red { 0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); } 50% { box-shadow: 0 0 0 4px rgba(220, 38, 38, 0); } }
.job-time { font-weight: 600; font-size: 9px; opacity: 0.95; font-variant-numeric: tabular-nums; }
.job-customer { font-weight: 500; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job-crew { font-size: 9px; opacity: 0.85; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; max-width: 540px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 22px; }
.modal-title { font-family: Georgia, serif; font-size: 19px; color: var(--accent); margin-bottom: 14px; }
.modal-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; font-size: 13px; }
.modal-row .label { color: var(--text-dim); min-width: 90px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.modal-row .value { color: var(--text); flex: 1; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
input[type="text"], textarea, select { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 5px; font-family: inherit; font-size: 12px; width: 100%; }
input[type="text"]:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }

/* Scenario row */
.scenario-row { background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 8px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; }
.scenario-row.active { border-color: var(--trainee); background: rgba(132, 204, 22, 0.05); }
.scenario-row .name { font-weight: 600; }
.scenario-row .meta { color: var(--text-dim); font-size: 11px; }

/* Loading spinner */
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 900px) {
  .calendar { grid-template-columns: 40px repeat(7, minmax(80px, 1fr)); overflow-x: auto; }
  #root { padding: 10px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
  }
}
</script>

<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';

const { useState, useEffect, useMemo, useCallback } = React;
const h = React.createElement;

// ==================== CONSTANTS ====================

const CLEANER_COLORS = {
  "Alissa D": "#e85d75", "Amber J": "#f0a830", "Anna F": "#7ed957", "April W": "#8b5cf6",
  "Brandi M": "#06b6d4", "Cathy W": "#f97316", "Danielle B": "#ec4899", "Genevieve O": "#14b8a6",
  "Heidi": "#84cc16", "Holly D": "#a78bfa", "Karen C": "#f59e0b", "Karen M": "#3b82f6",
  "Kelly K": "#ef4444", "Kristen K": "#a3a3a3", "Lada": "#fbbf24", "Margret W": "#c084fc",
  "Nicole D": "#22d3ee", "Nikki S": "#fb923c", "Rebecca D": "#10b981", "Rytham": "#65a30d",
  "Terrie B": "#dc2626", "Vanessa A": "#d946ef",
};
const TRAINEES = ["Rytham", "Heidi", "Lada"];

const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DAY_START_MIN = 8 * 60;
const DAY_END_MIN = 22 * 60;
const PX_PER_MIN = 1.0;

// ==================== UTILITIES ====================

function isoDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function fmtTime(min) {
  let h = Math.floor(min / 60), m = min % 60;
  const am = h < 12;
  if (h === 0) h = 12;
  else if (h > 12) h -= 12;
  return h + (m ? ':' + m.toString().padStart(2, '0') : '') + (am ? 'a' : 'p');
}

function parseJobTimes(job) {
  if (!job.start || !job.end) return null;
  const start = new Date(job.start);
  const end = new Date(job.end);
  return {
    date: isoDate(start),
    startMin: start.getHours() * 60 + start.getMinutes(),
    endMin: end.getHours() * 60 + end.getMinutes(),
  };
}

function getJobColor(crew) {
  if (!crew || !crew.length) return '#5a6b7d';
  const lead = crew.find(c => !TRAINEES.includes(c)) || crew[0];
  return CLEANER_COLORS[lead] || '#5a6b7d';
}

// Ensure a job has the fields the UI expects. Loaded scenarios or partial HCP records
// might have nulls; normalize defensively so renders don't blow up.
function normalizeJob(j) {
  return {
    id: j.id || `job_${Math.random().toString(36).slice(2)}`,
    customer: j.customer || '(unknown customer)',
    address: j.address || '',
    notes: j.notes || '',
    invoiceNumber: j.invoiceNumber || '',
    start: j.start || null,
    end: j.end || null,
    hcpCrew: Array.isArray(j.hcpCrew) ? j.hcpCrew : [],
    crew: Array.isArray(j.crew) ? j.crew : [],
    tags: j.tags || '',
    isTraineePair: !!j.isTraineePair,
  };
}

function detectConflicts(jobs) {
  // For each cleaner, find overlapping jobs on the same day
  const conflicts = [];
  const byCleaner = {};
  for (const j of jobs) {
    const t = parseJobTimes(j);
    if (!t) continue;
    for (const cleaner of j.crew) {
      if (!byCleaner[cleaner]) byCleaner[cleaner] = [];
      byCleaner[cleaner].push({ ...j, ...t });
    }
  }
  const conflictJobIds = new Set();
  for (const [cleaner, cJobs] of Object.entries(byCleaner)) {
    const byDate = {};
    for (const j of cJobs) {
      if (!byDate[j.date]) byDate[j.date] = [];
      byDate[j.date].push(j);
    }
    for (const [date, dJobs] of Object.entries(byDate)) {
      dJobs.sort((a, b) => a.startMin - b.startMin);
      for (let i = 0; i < dJobs.length - 1; i++) {
        for (let k = i + 1; k < dJobs.length; k++) {
          if (dJobs[i].endMin > dJobs[k].startMin) {
            conflicts.push({
              cleaner,
              date,
              jobA: dJobs[i],
              jobB: dJobs[k],
              overlapMin: dJobs[i].endMin - dJobs[k].startMin,
            });
            conflictJobIds.add(dJobs[i].id);
            conflictJobIds.add(dJobs[k].id);
          }
        }
      }
    }
  }
  return { conflicts, conflictJobIds };
}

// ==================== API ====================

async function fetchHcpData(start, end) {
  const res = await fetch(`/api/scheduler-pull?start=${start}&end=${end}`);
  if (!res.ok) throw new Error(`HCP pull failed: ${res.status}`);
  return res.json();
}

async function listScenarios() {
  const res = await fetch('/api/scheduler-scenarios');
  if (!res.ok) throw new Error('Failed to list scenarios');
  return res.json();
}

async function loadScenario(name) {
  const res = await fetch(`/api/scheduler-scenarios?name=${encodeURIComponent(name)}`);
  if (!res.ok) throw new Error('Failed to load scenario');
  return res.json();
}

async function saveScenario(name, jobs, weekStart, notes) {
  const res = await fetch('/api/scheduler-scenarios', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, jobs, weekStart, notes }),
  });
  if (!res.ok) throw new Error('Failed to save scenario');
  return res.json();
}

async function deleteScenario(name) {
  const res = await fetch(`/api/scheduler-scenarios?name=${encodeURIComponent(name)}`, {
    method: 'DELETE',
  });
  if (!res.ok) throw new Error('Failed to delete scenario');
  return res.json();
}

async function approveScenario(scenarioName) {
  const res = await fetch('/api/scheduler-current', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ scenarioName, approvedBy: 'Karen' }),
  });
  if (!res.ok) throw new Error('Failed to approve scenario');
  return res.json();
}

// ==================== COMPONENTS ====================

function App() {
  // Default to current week (or May 11 for now since that's what we're focused on)
  const [weekStart, setWeekStart] = useState('2026-05-11');
  const [jobs, setJobs] = useState([]);
  const [pulledAt, setPulledAt] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [cleanerFilter, setCleanerFilter] = useState('ALL');
  const [dayFilter, setDayFilter] = useState('WEEK');
  const [selectedJob, setSelectedJob] = useState(null);
  const [scenarios, setScenarios] = useState([]);
  const [currentScenarioName, setCurrentScenarioName] = useState(null);
  const [showSaveDialog, setShowSaveDialog] = useState(false);
  const [showScenarioList, setShowScenarioList] = useState(false);

  // Pull HCP data
  const pullHcp = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      const start = weekStart;
      const endDate = new Date(weekStart + 'T00:00:00');
      endDate.setDate(endDate.getDate() + 6);
      const end = isoDate(endDate);
      const data = await fetchHcpData(start, end);
      setJobs((data.jobs || []).map(normalizeJob));
      setPulledAt(data.pulled_at);
      setCurrentScenarioName(null);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, [weekStart]);

  // Refresh scenarios list
  const refreshScenarios = useCallback(async () => {
    try {
      const data = await listScenarios();
      setScenarios(data.scenarios || []);
    } catch (e) {
      console.error('Scenario list failed', e);
    }
  }, []);

  useEffect(() => {
    refreshScenarios();
  }, [refreshScenarios]);

  // Pull once on mount
  useEffect(() => {
    pullHcp();
  }, []);

  // Detect conflicts
  const { conflicts, conflictJobIds } = useMemo(() => detectConflicts(jobs), [jobs]);

  // Get unique cleaners from current jobs
  const cleanersInWeek = useMemo(() => {
    const set = new Set();
    for (const j of jobs) {
      for (const c of j.crew) set.add(c);
    }
    return Array.from(set).sort();
  }, [jobs]);

  // Filter jobs by cleaner
  const visibleJobs = useMemo(() => {
    if (cleanerFilter === 'ALL') return jobs;
    return jobs.filter(j => j.crew.includes(cleanerFilter));
  }, [jobs, cleanerFilter]);

  // Compute the 7 days of the week
  const days = useMemo(() => {
    const start = new Date(weekStart + 'T00:00:00');
    const out = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(start);
      d.setDate(d.getDate() + i);
      out.push(d);
    }
    return out;
  }, [weekStart]);

  // Save current jobs as a scenario
  const handleSave = async (name, notes) => {
    try {
      await saveScenario(name, jobs, weekStart, notes);
      setCurrentScenarioName(name);
      setShowSaveDialog(false);
      await refreshScenarios();
    } catch (e) {
      alert('Save failed: ' + e.message);
    }
  };

  // Load a scenario
  const handleLoadScenario = async (name) => {
    try {
      const data = await loadScenario(name);
      setJobs((data.jobs || []).map(normalizeJob));
      setWeekStart(data.weekStart || weekStart);
      setCurrentScenarioName(name);
      setPulledAt(data.savedAt);
      setShowScenarioList(false);
    } catch (e) {
      alert('Load failed: ' + e.message);
    }
  };

  // Approve current scenario
  const handleApprove = async () => {
    if (!currentScenarioName) {
      alert('Save this draft as a scenario first, then approve.');
      return;
    }
    if (!confirm(`Approve "${currentScenarioName}" as the active schedule? Aria will use this when answering schedule questions.`)) return;
    try {
      await approveScenario(currentScenarioName);
      alert(`✓ ${currentScenarioName} is now the approved schedule.`);
    } catch (e) {
      alert('Approve failed: ' + e.message);
    }
  };

  // Modify a job's crew (from the detail modal)
  const handleUpdateCrew = (jobId, newCrew) => {
    setJobs(prev => prev.map(j => j.id === jobId ? { ...j, crew: newCrew } : j));
    setSelectedJob(null);
  };

  // ==================== RENDER ====================
  return h('div', null,
    // Header
    h('div', { className: 'app-header' },
      h('div', null,
        h('div', { className: 'app-title' }, 'LHS Scheduler ', h('span', { className: 'accent' }, '·'), ' Karen\'s Working Page'),
        h('div', { className: 'app-subtitle' }, 'Pull HCP live · adjust drafts · save scenarios · approve for Aria'),
      ),
      h('div', { style: { fontSize: '11px', color: '#94a3b8' } },
        currentScenarioName
          ? h('span', null, 'Editing: ', h('strong', { style: { color: '#84cc16' } }, currentScenarioName))
          : h('span', null, 'Editing: HCP live data (unsaved)')
      ),
    ),

    // Error banner
    error && h('div', { className: 'banner warning' },
      h('strong', null, 'Error: '), error,
      h('button', { className: 'btn tiny', style: { marginLeft: '10px' }, onClick: pullHcp }, 'Retry')
    ),

    // Status bar
    h('div', { className: 'status-bar' },
      h('span', null,
        h('span', { className: 'pill ' + (pulledAt ? 'live' : 'stale') },
          pulledAt ? `Data pulled ${new Date(pulledAt).toLocaleTimeString()}` : 'No data yet'
        ),
        ' · ',
        jobs.length, ' active jobs · ', conflicts.length, ' conflict', conflicts.length !== 1 ? 's' : '', ' detected'
      ),
      h('span', null,
        'Week: ', h('input', {
          type: 'text', value: weekStart,
          onChange: (e) => setWeekStart(e.target.value),
          style: { width: '110px', fontSize: '11px', padding: '4px 6px' }
        })
      )
    ),

    // Toolbar
    h('div', { className: 'toolbar' },
      h('div', { className: 'toolbar-row' },
        h('span', { className: 'toolbar-label' }, 'Data'),
        h('button', { className: 'btn primary', onClick: pullHcp, disabled: loading },
          loading ? h('span', null, h('span', { className: 'spinner' }), ' Pulling…') : '↻ Pull from HCP'
        ),
        h('span', { className: 'spacer' }, '·'),
        h('span', { className: 'toolbar-label' }, 'Scenarios'),
        h('button', { className: 'btn', onClick: () => setShowSaveDialog(true) }, '+ Save as'),
        h('button', { className: 'btn', onClick: () => setShowScenarioList(true) },
          'Load… (', scenarios.length, ')'
        ),
        h('span', { className: 'spacer' }, '·'),
        h('button', {
          className: 'btn success', onClick: handleApprove,
          disabled: !currentScenarioName,
          title: currentScenarioName ? 'Mark this scenario as the approved schedule for Aria' : 'Save as a scenario first'
        }, '✓ Approve for Aria'),
      ),
      h('div', { className: 'toolbar-row' },
        h('span', { className: 'toolbar-label' }, 'View'),
        h('button', {
          className: 'btn' + (dayFilter === 'WEEK' ? ' active' : ''),
          onClick: () => setDayFilter('WEEK')
        }, 'Full Week'),
        h('span', { className: 'spacer' }, '·'),
        h('span', { className: 'toolbar-label' }, 'Day'),
        ...days.map((d, idx) => {
          const dateStr = isoDate(d);
          const dayName = DAY_NAMES[d.getDay()];
          const isActive = dayFilter === dateStr;
          return h('button', {
            key: dateStr,
            className: 'btn' + (isActive ? ' active' : ''),
            onClick: () => setDayFilter(dateStr),
            style: { fontVariantNumeric: 'tabular-nums', minWidth: '52px' }
          }, h('span', { style: { fontWeight: 600 } }, dayName), ' ', d.getDate());
        })
      ),
      h('div', { className: 'toolbar-row' },
        h('span', { className: 'toolbar-label' }, 'Filter'),
        h('button', {
          className: 'btn' + (cleanerFilter === 'ALL' ? ' active' : ''),
          onClick: () => setCleanerFilter('ALL')
        }, 'All cleaners'),
        ...cleanersInWeek.map(c => h('button', {
          key: c,
          className: 'btn' + (cleanerFilter === c ? ' active' : ''),
          onClick: () => setCleanerFilter(c),
          style: { borderLeft: `3px solid ${CLEANER_COLORS[c] || '#7ba7c9'}` }
        }, c, TRAINEES.includes(c) ? ' ★' : ''))
      )
    ),

    // Conflict list
    conflicts.length > 0 && h('div', { className: 'conflict-list' },
      h('div', { className: 'conflict-list-title' }, '⚠ ', conflicts.length, ' double-booking', conflicts.length !== 1 ? 's' : '', ' detected'),
      ...conflicts.slice(0, 6).map((c, i) => h('div', { key: i, className: 'conflict-item' },
        h('strong', null, c.cleaner), ' on ', new Date(c.date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
        ' · ', c.jobA.customer, ' (', fmtTime(c.jobA.startMin), '-', fmtTime(c.jobA.endMin), ')',
        ' overlaps ',
        c.jobB.customer, ' (', fmtTime(c.jobB.startMin), '-', fmtTime(c.jobB.endMin), ') by ',
        c.overlapMin, ' min'
      )),
      conflicts.length > 6 && h('div', { style: { fontSize: '11px', color: '#94a3b8', marginTop: '4px' } },
        '+ ', conflicts.length - 6, ' more')
    ),

    // Calendar
    h(CalendarView, {
      jobs: visibleJobs, days, conflictJobIds, onJobClick: setSelectedJob, dayFilter
    }),

    // Job detail modal
    selectedJob && h(JobModal, {
      job: selectedJob,
      onClose: () => setSelectedJob(null),
      onUpdate: handleUpdateCrew,
      allCleaners: Object.keys(CLEANER_COLORS),
    }),

    // Save dialog
    showSaveDialog && h(SaveDialog, {
      onSave: handleSave,
      onClose: () => setShowSaveDialog(false),
      currentName: currentScenarioName,
    }),

    // Scenario list dialog
    showScenarioList && h(ScenarioListDialog, {
      scenarios,
      onLoad: handleLoadScenario,
      onDelete: async (name) => {
        if (!confirm(`Delete scenario "${name}"?`)) return;
        await deleteScenario(name);
        await refreshScenarios();
      },
      onClose: () => setShowScenarioList(false),
    })
  );
}

function CalendarView({ jobs, days, conflictJobIds, onJobClick, dayFilter }) {
  // If dayFilter is a specific date, narrow days to just that one
  const visibleDays = useMemo(() => {
    if (dayFilter && dayFilter !== 'WEEK') {
      return days.filter(d => isoDate(d) === dayFilter);
    }
    return days;
  }, [days, dayFilter]);

  const totalMin = DAY_END_MIN - DAY_START_MIN;
  const totalH = totalMin * PX_PER_MIN;

  // Time labels column
  const timeCol = h('div', { className: 'time-col', style: { height: totalH + 'px' } },
    ...Array.from({ length: Math.floor((DAY_END_MIN - DAY_START_MIN) / 60) + 1 }, (_, i) => {
      const m = DAY_START_MIN + i * 60;
      return h('div', {
        key: m,
        className: 'time-label',
        style: { top: ((m - DAY_START_MIN) * PX_PER_MIN) + 'px' }
      }, fmtTime(m));
    })
  );

  // Day columns
  const dayCols = visibleDays.map((d, idx) => {
    const dateStr = isoDate(d);
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const dayJobs = jobs.filter(j => {
      const t = parseJobTimes(j);
      return t && t.date === dateStr;
    });

    // Compute overlap columns within this day
    const positioned = dayJobs.map(j => ({ ...j, ...parseJobTimes(j), _col: 0, _cols: 1 }));
    positioned.sort((a, b) => a.startMin - b.startMin);
    for (let i = 0; i < positioned.length; i++) {
      for (let k = 0; k < i; k++) {
        if (positioned[k].endMin > positioned[i].startMin && positioned[k].startMin < positioned[i].endMin) {
          positioned[i]._col = positioned[k]._col + 1;
          positioned[i]._cols = Math.max(positioned[i]._cols, positioned[i]._col + 1);
          for (let m = 0; m <= k; m++) {
            if (positioned[m].endMin > positioned[i].startMin) {
              positioned[m]._cols = Math.max(positioned[m]._cols, positioned[i]._col + 1);
            }
          }
        }
      }
    }

    const hourLines = Array.from({ length: Math.floor((DAY_END_MIN - DAY_START_MIN) / 30) + 1 }, (_, i) => {
      const m = DAY_START_MIN + i * 30;
      return h('div', {
        key: m,
        className: m % 60 === 0 ? 'hour-line' : 'half-line',
        style: { top: ((m - DAY_START_MIN) * PX_PER_MIN) + 'px' }
      });
    });

    const jobEls = positioned.map(j => {
      const top = (j.startMin - DAY_START_MIN) * PX_PER_MIN;
      const height = (j.endMin - j.startMin) * PX_PER_MIN - 2;
      const widthPct = 100 / j._cols;
      const leftPct = j._col * widthPct;
      const color = getJobColor(j.crew);
      const cls = 'job' +
        (j.isTraineePair ? ' trainee' : '') +
        (conflictJobIds.has(j.id) ? ' conflict' : '');

      return h('div', {
        key: j.id,
        className: cls,
        style: {
          '--c': color,
          top: top + 'px',
          height: height + 'px',
          left: `calc(${leftPct}% + 2px)`,
          width: `calc(${widthPct}% - 4px)`,
        },
        onClick: () => onJobClick(j),
      },
        h('div', { className: 'job-time' }, fmtTime(j.startMin), '-', fmtTime(j.endMin)),
        h('div', { className: 'job-customer' }, j.customer || '(no name)'),
        h('div', { className: 'job-crew' }, Array.isArray(j.crew) ? j.crew.join(', ') : '')
      );
    });

    return h('div', {
      key: dateStr,
      className: 'day-col' + (isWeekend ? ' weekend' : ''),
      style: { height: totalH + 'px' }
    }, ...hourLines, ...jobEls);
  });

  // Headers
  const headers = [h('div', { key: 'h0', className: 'cal-header' }, ' ')];
  visibleDays.forEach((d, i) => {
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    headers.push(h('div', {
      key: 'h' + i,
      className: 'cal-header' + (isWeekend ? ' weekend' : '')
    }, DAY_NAMES[d.getDay()], h('span', { className: 'date-num' }, d.getDate())));
  });

  // Adjust grid template based on visible day count
  const gridStyle = {
    gridTemplateColumns: `50px repeat(${visibleDays.length}, 1fr)`,
  };

  return h('div', { className: 'calendar', style: gridStyle }, ...headers, timeCol, ...dayCols);
}

function JobModal({ job, onClose, onUpdate, allCleaners }) {
  // Defensive: jobs may have missing fields. Normalize before render.
  const safeCrew = Array.isArray(job.crew) ? job.crew : [];
  const safeHcpCrew = Array.isArray(job.hcpCrew) ? job.hcpCrew : [];
  const [editedCrew, setEditedCrew] = useState(safeCrew.join(', '));

  const handleSave = () => {
    const newCrew = editedCrew.split(',').map(s => s.trim()).filter(Boolean);
    onUpdate(job.id, newCrew);
  };

  return h('div', { className: 'modal-backdrop', onClick: onClose },
    h('div', { className: 'modal', onClick: (e) => e.stopPropagation() },
      h('div', { className: 'modal-title' }, job.customer || '(no customer name)'),
      h('div', { className: 'modal-row' },
        h('span', { className: 'label' }, 'Time'),
        h('span', { className: 'value' }, job.start ? new Date(job.start).toLocaleString() : '—')
      ),
      h('div', { className: 'modal-row' },
        h('span', { className: 'label' }, 'Address'),
        h('span', { className: 'value' }, job.address || '—')
      ),
      h('div', { className: 'modal-row' },
        h('span', { className: 'label' }, 'HCP crew'),
        h('span', { className: 'value' }, safeHcpCrew.length ? safeHcpCrew.join(', ') : '—')
      ),
      job.tags && h('div', { className: 'modal-row' },
        h('span', { className: 'label' }, 'HCP tag'),
        h('span', { className: 'value' }, job.tags)
      ),
      h('div', { className: 'modal-row' },
        h('span', { className: 'label' }, 'Real crew'),
        h('input', {
          type: 'text',
          value: editedCrew,
          onChange: (e) => setEditedCrew(e.target.value),
          placeholder: 'comma-separated names'
        })
      ),
      job.notes && h('div', { className: 'modal-row' },
        h('span', { className: 'label' }, 'Notes'),
        h('span', { className: 'value', style: { whiteSpace: 'pre-wrap' } }, job.notes)
      ),
      h('div', { className: 'modal-actions' },
        h('button', { className: 'btn', onClick: onClose }, 'Cancel'),
        h('button', { className: 'btn primary', onClick: handleSave }, 'Update crew')
      )
    )
  );
}

function SaveDialog({ onSave, onClose, currentName }) {
  const [name, setName] = useState(currentName || '');
  const [notes, setNotes] = useState('');

  const handleSubmit = () => {
    if (!/^[A-Za-z0-9_-]+$/.test(name)) {
      alert('Name must be letters, numbers, dashes, or underscores only');
      return;
    }
    onSave(name, notes);
  };

  return h('div', { className: 'modal-backdrop', onClick: onClose },
    h('div', { className: 'modal', onClick: (e) => e.stopPropagation() },
      h('div', { className: 'modal-title' }, 'Save scenario'),
      h('div', { className: 'modal-row', style: { flexDirection: 'column', alignItems: 'stretch', gap: '6px' } },
        h('span', { className: 'label' }, 'Name'),
        h('input', {
          type: 'text', value: name,
          onChange: (e) => setName(e.target.value),
          placeholder: 'e.g. May11_PlanA',
          autoFocus: true
        })
      ),
      h('div', { className: 'modal-row', style: { flexDirection: 'column', alignItems: 'stretch', gap: '6px' } },
        h('span', { className: 'label' }, 'Notes (optional)'),
        h('textarea', {
          value: notes,
          onChange: (e) => setNotes(e.target.value),
          placeholder: 'What makes this scenario different?',
          rows: 3
        })
      ),
      h('div', { className: 'modal-actions' },
        h('button', { className: 'btn', onClick: onClose }, 'Cancel'),
        h('button', { className: 'btn primary', onClick: handleSubmit }, 'Save')
      )
    )
  );
}

function ScenarioListDialog({ scenarios, onLoad, onDelete, onClose }) {
  return h('div', { className: 'modal-backdrop', onClick: onClose },
    h('div', { className: 'modal', onClick: (e) => e.stopPropagation() },
      h('div', { className: 'modal-title' }, 'Saved scenarios'),
      scenarios.length === 0
        ? h('div', { style: { color: '#94a3b8', fontSize: '13px', padding: '20px 0', textAlign: 'center' } },
          'No scenarios saved yet. Save your current draft to come back to it later.')
        : scenarios.map(s => h('div', { key: s.name, className: 'scenario-row' },
          h('div', null,
            h('div', { className: 'name' }, s.name),
            h('div', { className: 'meta' },
              s.weekStart && `Week ${s.weekStart} · `,
              s.jobCount, ' jobs · saved ',
              s.savedAt && new Date(s.savedAt).toLocaleString()
            ),
            s.notes && h('div', { className: 'meta', style: { fontStyle: 'italic', marginTop: '3px' } }, s.notes)
          ),
          h('div', { style: { display: 'flex', gap: '6px' } },
            h('button', { className: 'btn tiny primary', onClick: () => onLoad(s.name) }, 'Load'),
            h('button', { className: 'btn tiny danger', onClick: () => onDelete(s.name) }, '✕')
          )
        )),
      h('div', { className: 'modal-actions' },
        h('button', { className: 'btn', onClick: onClose }, 'Close')
      )
    )
  );
}

// ==================== BOOT ====================

createRoot(document.getElementById('root')).render(h(App));
</script>
